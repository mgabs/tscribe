# Create your active config with: tscribe config --init
# Locate it with: tscribe config --path
# Restart the menu bar app after editing this file.

[recording]
sample_rate = 16000
channels = 1
# Device name or index as a string, e.g. "7". Empty uses automatic selection.
default_device = ""
auto_transcribe = true

[transcription]
model = "small"
language = "auto"
output_formats = ["txt", "json"] # Also supports "srt" and "vtt".
gpu = false # CUDA acceleration; keep false on macOS.
diarize = false
diarize_engine = "nemotron"  # "nemotron" or "wespeaker"

[storage]
data_dir = "" # Empty uses ~/.tscribe; supports paths such as ~/Recordings/tscribe.

[app]
notifications = true
recent_limit = 5
show_elapsed_time = true

# Experimental native-app live captions. Language uses transcription.language.
[captions]
enabled = false
model = "base" # Separate, smaller caption model; final transcript uses transcription.model.
audio_source = "both" # both, microphone, system
output_mode = "headphones" # headphones, speakers
echo_cancellation = true # Experimental; applies only with speakers + both sources.
font_size = 24 # 12–72 points
always_on_top = true

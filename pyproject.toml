[project]
name = "tscribe"
version = "1.0.0"
description = "Cross-platform CLI tool for recording audio and transcribing with faster-whisper"
requires-python = ">=3.10,<3.14"
dependencies = [
    "click>=8.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "faster-whisper>=1.2.1",
    "onnxruntime<=1.21.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "yt-dlp>=2024.0",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "scikit-learn>=1.3.0",
    "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.scripts]
tscribe = "tscribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (requires model download)"]
addopts = "--tb=short -m 'not slow'"

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/tscribe/config.py", "src/tscribe/paths.py"]
pytest_add_cli_args_test_selection = ["tests/test_config.py", "tests/test_paths.py"]
use_setproctitle = false

[dependency-groups]
dev = [
    "mutmut>=3.8,<4",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]
mac-app = [
    "pyinstaller>=6,<7 ; sys_platform == 'darwin'",
]
